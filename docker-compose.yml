# Base Compose definition for the Capital Care API.
# Environment-specific behavior, including the host port, lives in the overrides:
#   DEV: docker-compose.dev.yml  (host port 3000; database exists only while the container runs)
#   PRD: docker-compose.prd.yml  (host port 8000; database persists in a named volume)
# The container always listens on 3000 internally. Host ports are set in the overrides
# (not here) so that Compose does not merge duplicate port mappings.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#   docker compose -f docker-compose.yml -f docker-compose.prd.yml up -d --build

services:
  api:
    build:
      context: .
      target: runtime
    image: capital-care-api:local
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      # Container-internal values; override .env for these
      PORT: "3000"
      DB_PATH: /app/data/capital-care.db
    restart: "no"
