# DEV: the database lives in tmpfs (RAM). It is discarded whenever the
# container stops or restarts, so every `up` starts from an empty database.
# uid/gid match the non-root `node` user in the image (UID 1000) so it can
# create the database file.
# DEV host port: API_PORT (default 3000). The `api` and `api-latest` services
# both publish this port, so they cannot run at the same time.
services:
  api:
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      ACCOUNT_LIMIT: "5"
    tmpfs:
      - /app/data:uid=1000,gid=1000,mode=0755

  # DEV: runs the latest published image (main build from GHCR) instead of
  # building locally. Same DEV behavior as `api` (tmpfs database). Not started
  # by a plain `up`; start it explicitly:
  #   docker compose -f docker-compose.yml -f docker-compose.dev.yml up api-latest
  # Publishes the same host port as `api` (API_PORT, default 3000), so `api`
  # and `api-latest` cannot run at the same time. Stop one before starting the other.
  api-latest:
    image: ghcr.io/tghcastro/capital-care-v2:latest
    pull_policy: always
    profiles:
      - published
    init: true
    ports:
      - "${API_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      ACCOUNT_LIMIT: "5"
      PORT: "3000"
      DB_PATH: /app/data/capital-care.db
    tmpfs:
      - /app/data:uid=1000,gid=1000,mode=0755
    restart: "no"
