<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1280px;height:640px;font-family:Montserrat,Arial,sans-serif;background:#00664a;color:#fff;position:relative;overflow:hidden}
.bg{position:absolute;right:-180px;top:-180px;width:640px;height:640px;border-radius:50%;background:#008254;opacity:.55}
.bg2{position:absolute;right:120px;bottom:-260px;width:420px;height:420px;border-radius:50%;background:#0a7a58;opacity:.6}
.wrap{position:relative;padding:72px 80px}
.kicker{font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:20px;color:#b8f2d6}
h1{font-size:96px;font-weight:800;letter-spacing:-.02em;margin-top:14px}
p{font-size:32px;font-weight:400;margin-top:14px;max-width:900px;line-height:1.3;color:#e6fff3}
.flow{display:flex;align-items:center;gap:10px;margin-top:64px;flex-wrap:nowrap}
.chip{background:#fff;color:#00664a;font-weight:700;font-size:20px;padding:12px 16px;border-radius:8px;white-space:nowrap}
.chip.h{background:#d9f99d;color:#1f3d00}
.arr{font-size:22px;color:#b8f2d6;font-weight:700}
.foot{position:absolute;left:80px;bottom:44px;font-size:20px;color:#b8f2d6;font-weight:600}
</style></head><body>
<div class="bg"></div><div class="bg2"></div>
<div class="wrap">
<div class="kicker">Agentic development · case study</div>
<h1>Capital Care</h1>
<p>A personal finance tracker built by one developer and AI agents, through a spec-driven workflow.</p>
<div class="flow">
<span class="chip">Linear issue</span><span class="arr">→</span>
<span class="chip">PRD</span><span class="arr">→</span>
<span class="chip h">Plan reviewed</span><span class="arr">→</span>
<span class="chip">Claude Code</span><span class="arr">→</span>
<span class="chip">PR + CI</span><span class="arr">→</span>
<span class="chip">Release</span>
</div>
</div>
<div class="foot">github.com/tghcastro/capital-care-v2</div>
</body></html>
